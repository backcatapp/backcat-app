services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: backcat-postgres
    environment:
      POSTGRES_USER: backcat
      POSTGRES_PASSWORD: backcat
      POSTGRES_DB: backcat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backcat"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: backcat-neo4j
    environment:
      NEO4J_AUTH: neo4j/backcatdev
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      # HTTP can answer before Bolt accepts connections — worker uses bolt://.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p backcatdev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: backcat-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: backcatdev
      # Browser-facing issuer. Defaults = local dev. Production: set PUBLIC_KEYCLOAK
      # in root `.env` (see .env.production.example).
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK:-http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      # No state volume on purpose: the committed realm export is the source of
      # truth; the container re-imports it on every start. Dev users/sessions
      # are throwaway.
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  # --- app services: `docker compose up -d` is the whole stack, no separate
  # `npm run dev` / `uvicorn` terminals needed. Trade-off: this is a *built*
  # image, not a hot-reloading dev server — after a code change, rebuild the
  # affected service (`docker compose up -d --build <service>`). Use
  # `npm run dev` / a bare `uvicorn` directly on the host instead when you
  # want live reload during active iteration on one service.

  serve:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: backcat-serve
    command: uvicorn backcat_serve.main:app --host 0.0.0.0 --port 8000
    working_dir: /app/serve
    env_file:
      - pipeline/.env
    environment:
      DATABASE_URL: postgresql://backcat:backcat@postgres:5432/backcat
      NEO4J_URI: bolt://neo4j:7687
      CORS_ORIGIN: ${PUBLIC_WEB:-http://localhost:3000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      KEYCLOAK_ISSUER: ${PUBLIC_KEYCLOAK:-http://localhost:8080}/realms/backcat
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/backcat/protocol/openid-connect/certs
      BYOK_SECRET: ${BYOK_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      keycloak:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: backcat-worker
    # migrate + Neo4j constraints on every start — both idempotent (migrate
    # tracks applied files; MERGE-based constraints are a no-op if present).
    command: >
      sh -c "migrate &&
      python -m backcat_pipeline.wait_neo4j &&
      ingest worker --interval 5"
    env_file:
      - pipeline/.env
    environment:
      DATABASE_URL: postgresql://backcat:backcat@postgres:5432/backcat
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - pipelinedata:/app/pipeline/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  web:
    build:
      context: ./web
    container_name: backcat-web
    # Prefer env-specific file; fall back to .env.local for either.
    # Compose v2.24+: required: false. If your compose is older, keep only
    # web/.env.local and copy from the matching *.example.
    env_file:
      - path: web/.env.${BACKCAT_ENV:-development}
        required: false
      - path: web/.env.local
        required: false
    environment:
      DATABASE_URL: postgresql://backcat:backcat@postgres:5432/backcat
      AUTH_URL: ${PUBLIC_WEB:-http://localhost:3000}
      AUTH_KEYCLOAK_ISSUER: ${PUBLIC_KEYCLOAK:-http://localhost:8080}/realms/backcat
      AUTH_KEYCLOAK_INTERNAL_HOST: keycloak:8080
      SERVE_INTERNAL_URL: http://serve:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  pgdata:
  neo4jdata:
  pipelinedata:
