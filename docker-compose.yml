services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: backcat-postgres
    environment:
      POSTGRES_USER: backcat
      POSTGRES_PASSWORD: backcat
      POSTGRES_DB: backcat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backcat"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: backcat-neo4j
    environment:
      NEO4J_AUTH: neo4j/backcatdev
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: backcat-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: backcatdev
    ports:
      - "8080:8080"
    volumes:
      # No state volume on purpose: the committed realm export is the source of
      # truth; the container re-imports it on every start. Dev users/sessions
      # are throwaway.
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
  neo4jdata:
