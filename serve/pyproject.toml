[project]
name = "backcat-serve"
version = "0.1.0"
description = "Backcat query API: SSE streaming answers direct to the browser"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # backcat-pipeline is installed editable from ../pipeline (shared local venv
    # during the sprint; Railway gets its own image later)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backcat_serve"]
